crons:
  - name: meeting-reminders
    description: "Per-member timezone fan-out: emails each active family member their own reminder the day before an upcoming meeting, at their local reminder hour. Runs hourly."
    cron: "0 * * * *"
    timezone: "UTC"
    endpoint: "{{BASE_URL}}/api/cron/meeting-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
